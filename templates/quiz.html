<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
</head>
<body>

<h2>Quiz</h2>

<p>Time Left: <span id="timer">4:00</span></p>

<form id="quizForm" method="post" action="/submit/{{ quiz_id }}">

    <!-- 🔥 Roll Number Field Added -->
    <label><b>Enter Roll Number:</b></label><br>
    <input type="text" name="roll_number" required>
    <br><br>

    {% for q in questions %}
        <div>
            <!-- ⚠️ Question index corrected -->
            <p><b>{{ q[2] }}</b></p>

            <input type="radio" name="q{{ q[0] }}" value="{{ q[3] }}" required> {{ q[3] }}<br>
            <input type="radio" name="q{{ q[0] }}" value="{{ q[4] }}"> {{ q[4] }}<br>
            <input type="radio" name="q{{ q[0] }}" value="{{ q[5] }}"> {{ q[5] }}<br>
            <input type="radio" name="q{{ q[0] }}" value="{{ q[6] }}"> {{ q[6] }}<br>
        </div>
        <hr>
    {% endfor %}

    <button type="submit">Submit</button>
</form>

<script>
let timeLeft = 240;
let timer = document.getElementById("timer");

let countdown = setInterval(function() {
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    if (seconds < 10) seconds = "0" + seconds;

    timer.innerText = minutes + ":" + seconds;
    timeLeft--;

    if (timeLeft < 0) {
        clearInterval(countdown);
        document.getElementById("quizForm").submit();
    }
}, 1000);
</script>

</body>
</html>
